name: Deploy War Robots Guide Website

on:
  push:
    branches:
      - master
  schedule:
    # Run daily at midnight UTC to check for Google Drive updates
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    env:
      GDRIVE_IMAGES_FOLDER_ID: ${{ secrets.GDRIVE_IMAGES_FOLDER_ID }}
    permissions:
      contents: write # Required for peaceiris/actions-gh-pages to deploy

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Install Python dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Drive image sync
        run: python -m unittest discover -s scripts/tests -v

      - name: Restore Google Drive image cache
        if: env.GDRIVE_IMAGES_FOLDER_ID != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sample images/
          key: ${{ runner.os }}-drive-images-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-drive-images-v1-

      # 4. Fetch the latest files from Google Drive (Optional if secrets are set)
      - name: Fetch Google Drive Content
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_DOWNLOAD_WORKERS: '4'
        run: |
          python scripts/fetch_gdrive.py

      # Content-addressed snapshots avoid uploading unchanged images each run.
      # This step runs only after a fully successful listing and image sync.
      - name: Save Google Drive image cache
        if: env.GDRIVE_IMAGES_FOLDER_ID != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sample images/
          key: ${{ runner.os }}-drive-images-v1-${{ hashFiles('sample images/.drive-image-manifest.json') }}

      # 5. Parse raw spreadsheets and word guides into structured JSON
      - name: Restore equipment history from the last successful deployment
        run: |
          # The published JSON advances atomically with the successful site deploy.
          # Missing branch/file is expected only for the initial migration.
          git ls-remote --heads origin gh-pages > /tmp/published-branch
          if [ -s /tmp/published-branch ]; then
            git fetch --no-tags --depth=1 origin gh-pages
            if git cat-file -e FETCH_HEAD:src/data/equipment_newness.json; then
              git show FETCH_HEAD:src/data/equipment_newness.json > /tmp/equipment_newness.json
              python -m json.tool /tmp/equipment_newness.json > /dev/null
              cp /tmp/equipment_newness.json src/data/equipment_newness.json
            fi
            pilot_snapshot=$(mktemp)
            if git cat-file -e FETCH_HEAD:src/data/pilot_tiers.json 2>/dev/null; then
              git show FETCH_HEAD:src/data/pilot_tiers.json > "$pilot_snapshot"
              if python scripts/pilot_tiers.py --validate "$pilot_snapshot"; then
                cp "$pilot_snapshot" src/data/pilot_tiers.json
              else
                echo "::warning::Published pilot snapshot is invalid; retaining checked-in fallback."
              fi
            fi
            rm -f "$pilot_snapshot"
          fi

      - name: Refresh optional CrimsonHawk pilot tiers
        run: python scripts/pilot_tiers.py --refresh

      - name: Parse Data Files
        run: |
          python scripts/parse_data.py

      - name: Refresh equipment release metadata
        run: python scripts/equipment_updates.py

      # 6. Setup Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      # 7. Install Node.js dependencies
      - name: Install Node.js Dependencies
        run: npm ci

      # 8. Lint the code to verify quality
      - name: Lint Codebase
        run: npm run lint

      # 9. Validate generated JSON contracts before the frontend imports them
      - name: Validate Data Files
        run: npm run validate:data

      # 10. Run the test suite against the freshly generated data
      - name: Run Tests
        run: npm test

      # 11. Build and verify the static React application
      - name: Build Production Assets
        run: npm run build

      # 12. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
