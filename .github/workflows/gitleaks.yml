name: Gitleaks

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 
      
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --show-error --silent \
            --output "${GITLEAKS_ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${GITLEAKS_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${GITLEAKS_ARCHIVE}" gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --verbose --redact
